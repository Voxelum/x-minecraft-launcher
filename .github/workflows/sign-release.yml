name: Sign Release

# Sign the APPX and DeskGap EXE in the same regular release via SignPath,
# then upload their final signed bytes and checksums before publishing.
#
# Why a separate workflow?
#   SignPath signing requires a human to approve the request in the SignPath
#   web UI. If approval is forgotten while the main `Build` workflow is
#   waiting, the in-line sign step times out and the appx ends up missing
#   from the release. Splitting it out lets the release draft be created
#   immediately (with an unsigned .appx) and signed on demand.
#
# Typical flow:
#   1. Push a `chore(release)` commit. `Build` produces a draft release
#      containing the unsigned `.appx` and DeskGap `.exe`.
#   2. When ready, run this workflow with the release tag (e.g. `v0.56.7`).
#   3. Approve the request in SignPath when prompted.
#   4. Both signed binaries and their `.sha256` files replace the unsigned ones,
#      and the draft is automatically flipped to a published release.
#
# NOTE: The SignPath project trust config must allow this workflow file
# path (`.github/workflows/sign-release.yml`) in addition to (or instead
# of) the old build.yml entry, or signing requests will be rejected.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sign (e.g. v0.56.7). Leave empty to sign the latest draft release.'
        required: false
        type: string

permissions:
  contents: write  # gh release download / upload

jobs:
  sign:
    runs-on: windows-latest
    # SignPath approval can sit in a queue for a while. Give it room.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: resolve-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            # No tag supplied: pick the most recent draft release. Builds
            # publish their drafts here, so the newest draft is the target.
            $tag = gh release list --limit 30 --json tagName,isDraft,createdAt |
              ConvertFrom-Json |
              Where-Object { $_.isDraft -and $_.tagName -match '^v\d+\.' } |
              Sort-Object { [datetime]$_.createdAt } -Descending |
              Select-Object -First 1 -ExpandProperty tagName
            if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "No draft release found to sign. Specify a tag explicitly."
            }
            Write-Host "Resolved latest draft release tag: $tag"
          } else {
            Write-Host "Using supplied tag: $tag"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Use a regular v<version> release tag' }
          $release = gh release view "$tag" --json isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the release; refusing to sign or publish' }
          if (!(($release | ConvertFrom-Json).isDraft)) { throw 'Only unsigned drafts may be signed; never replace published binaries' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "deskgap=xmcl-deskgap-$($tag.Substring(1))-win32-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Download .appx from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input | Out-Null
          gh release download "${{ steps.resolve-tag.outputs.tag }}" --pattern '*.appx' --dir signing-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appx = Get-ChildItem signing-input -Filter *.appx
          if ($appx.Count -eq 0) {
            throw "No .appx asset found on release ${{ steps.resolve-tag.outputs.tag }}"
          }
          $appx | ForEach-Object { Write-Host "Downloaded $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)" }

      - name: Download DeskGap EXE from the same draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
          DESKGAP_NAME: ${{ steps.resolve-tag.outputs.deskgap }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing-deskgap | Out-Null
          gh release download "$env:RELEASE_TAG" --pattern "$env:DESKGAP_NAME" --dir signing-deskgap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .appx as workflow artifact
        id: upload-artifact
        uses: actions/upload-artifact@v6
        with:
          name: appx
          path: signing-input/*.appx

      - name: Submit APPX signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.CODE_SIGN_TOKEN }}
          organization-id: ab51b40d-a5bd-4d25-ae54-66ccabf86161
          project-slug: x-minecraft-launcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
          artifact-configuration-slug: appx
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: Upload DeskGap EXE as workflow artifact
        id: upload-deskgap
        uses: actions/upload-artifact@v6
        with:
          name: deskgap-exe
          path: signing-deskgap/*.exe
          if-no-files-found: error

      - name: Submit DeskGap EXE signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.CODE_SIGN_TOKEN }}
          organization-id: ab51b40d-a5bd-4d25-ae54-66ccabf86161
          project-slug: x-minecraft-launcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-deskgap.outputs.artifact-id }}
          artifact-configuration-slug: deskgap-exe
          wait-for-completion: true
          output-artifact-directory: signed-deskgap/

      - name: Verify DeskGap signature and compute final binary hashes
        env:
          DESKGAP_NAME: ${{ steps.resolve-tag.outputs.deskgap }}
        shell: pwsh
        run: |
          $exe = Join-Path signed-deskgap $env:DESKGAP_NAME
          .\.github\scripts\verify-deskgap-signature.ps1 -Path $exe
          Copy-Item -LiteralPath $exe -Destination signed\
          $exe = Join-Path signed $env:DESKGAP_NAME
          $appx = @(Get-ChildItem signed -Filter *.appx)
          if ($appx.Count -eq 0) { throw 'SignPath did not return a signed APPX' }
          @($appx) + @(Get-Item $exe) | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $shaFile = "$($_.FullName).sha256"
            [System.IO.File]::WriteAllText($shaFile, $hash)
            Write-Host "$($_.Name) -> $hash"
          }

      - name: Upload signed assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # --clobber replaces existing assets with the same name, so the
          # unsigned binaries are swapped for the final SignPath output.
          # Checksums always describe those signed bytes, never build inputs.
          gh release upload "${{ steps.resolve-tag.outputs.tag }}" (Get-ChildItem signed -Filter *.appx).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "${{ steps.resolve-tag.outputs.tag }}" (Get-ChildItem signed -Filter *.appx.sha256).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "${{ steps.resolve-tag.outputs.tag }}" (Get-ChildItem signed -Filter xmcl-deskgap-*-win32-x64.exe).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "${{ steps.resolve-tag.outputs.tag }}" (Get-ChildItem signed -Filter xmcl-deskgap-*-win32-x64.exe.sha256).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        # Signing succeeded and the signed assets are in place, so flip the
        # draft off. `gh release edit --draft=false` is a no-op if the
        # release is already published.
        #
        # NOTE: must use PAT_GITHUB_TOKEN (not the workflow's GITHUB_TOKEN).
        # Events caused by GITHUB_TOKEN don't trigger downstream workflows,
        # so publishing with GITHUB_TOKEN silently skips `Deploy Release`
        # (which listens for `release: [published]`). The PAT belongs to a
        # human (ci010) so the publish event cascades normally.
        # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release edit "${{ steps.resolve-tag.outputs.tag }}" --draft=false
