name: Core Package Publish

on:
  push:
    branches:
      - master
    paths:
      - 'packages/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    if: ${{ startsWith(github.event.head_commit.message, 'chore(release)') }}

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - uses: pnpm/action-setup@v6
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'
    - name: Use npm with trusted publishing support
      run: npm install --global npm@^11.15.0
    - name: Install
      run: |
        pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build
      run: |
        pnpm --parallel build:type
        pnpm --parallel build:cjs
        pnpm --parallel build:esm
        pnpm --parallel build:browser
    - name: Publish
      run: |
        node <<'NODE'
        const { execFileSync } = require('node:child_process')
        const { existsSync, readdirSync, readFileSync } = require('node:fs')
        const { join } = require('node:path')

        for (const entry of readdirSync('packages', { withFileTypes: true })) {
          if (!entry.isDirectory()) continue

          const directory = join('packages', entry.name)
          const packageJson = join(directory, 'package.json')
          if (!existsSync(packageJson)) continue

          const pkg = JSON.parse(readFileSync(packageJson, 'utf8'))
          if (pkg.private) continue

          try {
            execFileSync('npm', [
              'view',
              `${pkg.name}@${pkg.version}`,
              'version',
              '--registry=https://registry.npmjs.org',
            ], { stdio: 'ignore' })
            console.log(`Skipping ${pkg.name}@${pkg.version}; it is already published.`)
          } catch {
            execFileSync('npm', ['publish', '--access=public', '--ignore-scripts'], {
              cwd: directory,
              stdio: 'inherit',
            })
          }
        }
        NODE
    - name: Build Docs
      run: |
        pnpm build:docs
    - name: Deploy to Github Pages
      uses: crazy-max/ghaction-github-pages@v4
      with:
        target_branch: gh-pages
        build_dir: docs/
      env:
        GITHUB_PAT: ${{ secrets.PAT_GITHUB_TOKEN }}
