name: Build

on:
  push:
    branches:
      - master
    paths:
      - "xmcl-runtime/**"
      - "xmcl-runtime-api/**"
      - "xmcl-keystone-ui/**"
      - "xmcl-electron-app/**"
      - "deskgap-app/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a signed test release to the development bucket"
        type: choice
        options: [none, dev]
        default: none

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Redirect Electron / electron-builder caches to a workspace-local path
      # so a single `path:` works on Linux, macOS, and Windows.
      # @electron/get honors ELECTRON_CACHE; electron-builder honors ELECTRON_BUILDER_CACHE.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Fix node-gyp and Python
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        run: python3 -m pip install --break-system-packages --user packaging setuptools
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Cache Electron binaries
        # Restored before `pnpm install` so the electron postinstall
        # (@electron/get) sees the cache and skips re-downloading the zip.
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          # No restore-keys: a partial hit on a different electron version
          # would still force a redownload, so the fallback adds no value.
      - name: Cache Vite deps
        uses: actions/cache@v5
        with:
          path: xmcl-keystone-ui/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'xmcl-keystone-ui/vite.config.ts') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Setup Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Build
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          pnpm run --prefix xmcl-electron-app build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          RELEASE: ${{ startsWith(github.event.head_commit.message, 'chore(release)') }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
          # A dev test release must check the dev service, or it could never see its own update.
          VARDRYNN_API_BASE_URL: ${{ inputs.publish == 'dev' && vars.VARDRYNN_DEV_API_BASE_URL || vars.VARDRYNN_API_BASE_URL }}
          VARDRYNN_RELEASE_PUBLIC_KEY: ${{ vars.VARDRYNN_RELEASE_PUBLIC_KEY }}
          VARDRYNN_MICROSOFT_CLIENT_ID: ${{ vars.VARDRYNN_MICROSOFT_CLIENT_ID }}
          VARDRYNN_DISCORD_APP_ID: ${{ vars.VARDRYNN_DISCORD_APP_ID }}
      - name: Resolve pinned DeskGap runtime
        if: ${{ runner.os == 'Windows' }}
        id: deskgap
        shell: pwsh
        run: |
          $version = (Get-Content deskgap-app\package.json -Raw | ConvertFrom-Json).config.deskgapVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Pin an exact published DeskGap version in deskgap-app/package.json' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Checkout matching DeskGap packaging helpers
        if: ${{ runner.os == 'Windows' }}
        uses: actions/checkout@v5
        with:
          repository: Voxelum/DeskGap
          ref: v${{ steps.deskgap.outputs.version }}
          path: deskgap-runtime-source
          persist-credentials: false
      - name: Use Node.js 24 for DeskGap packaging
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install DeskGap packaging helpers
        if: ${{ runner.os == 'Windows' }}
        working-directory: deskgap-runtime-source
        run: npm ci
      - name: Download pinned DeskGap Windows runtime
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          DESKGAP_VERSION: ${{ steps.deskgap.outputs.version }}
        run: |
          $name = "deskgap-v$env:DESKGAP_VERSION-win32-x64.zip"
          $base = "https://github.com/Voxelum/DeskGap/releases/download/v$env:DESKGAP_VERSION"
          $directory = 'deskgap-app\build\runtime'
          New-Item -ItemType Directory -Force $directory | Out-Null
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile "$directory\SHA256SUMS"
          $pattern = '^([a-fA-F0-9]{64})\s+\*?' + [regex]::Escape($name) + '$'
          $entries = @(Get-Content "$directory\SHA256SUMS" | Where-Object { $_ -match $pattern })
          if ($entries.Count -ne 1) { throw "Expected exactly one checksum for $name in the pinned runtime release" }
          $expected = [regex]::Match($entries[0], $pattern).Groups[1].Value
          Invoke-WebRequest "$base/$name" -OutFile "$directory\$name"
          if ((Get-FileHash "$directory\$name" -Algorithm SHA256).Hash -ne $expected) { throw 'DeskGap runtime checksum mismatch' }
          Expand-Archive "$directory\$name" "$directory\extracted"
      - name: Build DeskGap single EXE alongside Electron
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
          VARDRYNN_MICROSOFT_CLIENT_ID: ${{ vars.VARDRYNN_MICROSOFT_CLIENT_ID }}
          VARDRYNN_DISCORD_APP_ID: ${{ vars.VARDRYNN_DISCORD_APP_ID }}
          DESKGAP_VERSION: ${{ steps.deskgap.outputs.version }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'deskgap-runtime-source'
          $extracted = Join-Path $env:GITHUB_WORKSPACE 'deskgap-app\build\runtime\extracted'
          $runtime = Join-Path $extracted 'DeskGap'
          $bootstrap = Join-Path $extracted "DeskGapBootstrap-v$env:DESKGAP_VERSION-win32-x64.exe"
          pnpm --prefix=deskgap-app package "$source" "$runtime" "$bootstrap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload DeskGap preview (not part of the release)
        # DeskGap is reviewed as a separate distribution target and is not published
        # with Vardrynn releases. Keep it out of xmcl-electron-app/build/output.
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: deskgap-preview
          path: deskgap-app/build/output/release/vardrynn-deskgap-*-win32-x64.exe
      - name: Upload Source Maps
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: sourcemap
          path: |
            xmcl-electron-app/dist/*.js.map
            xmcl-electron-app/dist/renderer/assets/*.js.map
      - name: Upload Build
        # Windows .appx in this artifact is UNSIGNED. The `release` job creates a
        # draft; `Sign Release` signs APPX before publication. DeskGap is excluded.
        if: ${{ startsWith(github.event.head_commit.message, 'chore(release)') }}
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}
          path: |
            xmcl-electron-app/build/output/
      - name: Upload Windows Zip Build
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: win-b${{ github.run_number }}
          path: |
            xmcl-electron-app/build/output/win-unpacked/
      - name: Upload Linux x64 Zip Build
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-b${{ github.run_number }}-x64
          path: |
            xmcl-electron-app/build/output/linux-unpacked/
      - name: Upload Linux arm64 Zip Build
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-b${{ github.run_number }}-arm64
          path: |
            xmcl-electron-app/build/output/linux-arm64-unpacked/
      - name: Upload Mac x64 Zip Build
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: mac-b${{ github.run_number }}-x64
          path: |
            xmcl-electron-app/build/output/mac/
      - name: Upload Mac arm64 Zip Build
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: mac-b${{ github.run_number }}-arm64
          path: |
            xmcl-electron-app/build/output/mac-arm64/

  build-arch:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ false }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            pkg_arch: amd64
          - arch: aarch64
            pkg_arch: arm64
    container: archlinux:latest
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm base-devel nodejs npm
      - name: Install Git
        run: |
          pacman -S --noconfirm git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # build-arch only needs `package.json` from the working tree;
          # full history is here only so this comment block is consistent
          # with the other jobs. The job is currently disabled (`if: false`).
          filter: blob:none
      - name: Download Ubuntu Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-Linux
          path: ./
      - name: Extract version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Build Package
        run: |
          mkdir -p build
          cd build
          useradd builder -m
          chown -R builder:builder ./

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp "../xmcl-${{ steps.version.outputs.version }}-amd64.deb" ./
            DEB_FILE="xmcl-${{ steps.version.outputs.version }}-amd64.deb"
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then
            cp "../xmcl-${{ steps.version.outputs.version }}-arm64.deb" ./
            DEB_FILE="xmcl-${{ steps.version.outputs.version }}-arm64.deb"
          fi

          cat > PKGBUILD << EOF
          pkgname=xmcl-launcher
          pkgver=${{ steps.version.outputs.version }}
          pkgrel=1
          pkgdesc="XMCL - A modern Minecraft launcher"
          arch=('${{ matrix.arch }}')
          url="https://xmcl.app/"
          license=('MIT')
          provides=("xmcl")
          conflicts=('xmcl-launcher-bin')
          options=(!strip !debug)
          source=("$DEB_FILE")
          noextract=("$DEB_FILE")
          sha256sums=('SKIP')

          package() {
              cd "\${srcdir}"
              bsdtar -xf "$DEB_FILE" data.tar.xz
              bsdtar -xf data.tar.xz -C "\${pkgdir}"
              install -dv "\${pkgdir}/usr/bin"
          }
          EOF

          # Create makepkg configuration
          cat > /etc/makepkg.conf << EOF
          MAKEFLAGS="-j\$(nproc)"
          PKGEXT='.pkg.tar.zst'
          SRCEXT='.src.tar'
          COMPRESSZST=(zstd -c -T0 -18 -)
          EOF

          # Set permissions and build
          chown -R builder:builder .
          su builder -c "CARCH=${{ matrix.arch }} makepkg -sf --noconfirm"
          if [ -f *.pkg.tar.zst ]; then
            for f in *.pkg.tar.zst; do
              mv "$f" "../xmcl-${{ steps.version.outputs.version }}-${{ matrix.arch }}.pacman"
            done
          fi

      - name: Upload Arch Package
        uses: actions/upload-artifact@v6
        with:
          name: build-Arch-${{ matrix.arch }}
          path: ./*.pacman
  prepare-release:
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Treeless clone: full commit graph (needed by
          # semantic-version-bump-action's `git log <last-tag>..HEAD`)
          # but blobs are fetched on demand. Skips downloading every
          # historical file revision.
          filter: blob:none
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install
        run: |
          pnpm install --frozen-lockfile --filter ./.github/actions
      - name: Bump Version
        id: version
        run: pnpm tsx .github/actions/prepare-pr/index.ts
        env:
          CI: true
      # - name: Update Sponsor
      #   uses: Voxelum/afdian-sponsor-action@master
      #   with:
      #     user-id: ${{ secrets.AFDIAN_USER_ID }}
      #     token: ${{ secrets.AFDIAN_TOKEN }}
      #     markdown: |
      #       README.md
      #       README.zh.md
      - name: Update Lock File
        if: ${{ steps.version.outputs.release == 'true' }}
        run: pnpm i --lockfile-only
      - name: Create Pull Request
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): version ${{ steps.version.outputs.version }}"
          title: Prepare Release ${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.changelog }}
          branch: prepare-release

  # Signs the packages, keeps them as a workflow artifact, then publishes them: chore(release)
  # commits go to the production bucket, a manual run with publish=dev to the development bucket.
  # Secrets live on the `release` environment.
  release:
    if: startsWith(github.event.head_commit.message, 'chore(release)') || inputs.publish == 'dev'
    runs-on: ubuntu-latest
    environment: release
    needs:
      - build
    env:
      TARGET: ${{ inputs.publish == 'dev' && 'dev' || 'prod' }}
      S3_ENDPOINT: ${{ vars.VARDRYNN_S3_ENDPOINT }}
      S3_BUCKET: ${{ inputs.publish == 'dev' && vars.VARDRYNN_S3_DEV_BUCKET || vars.VARDRYNN_S3_PROD_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile --filter ./.github/actions
      - name: Download Build
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: true
          path: build
      - name: Sign release manifest and checksums
        env:
          VARDRYNN_RELEASE_SIGNING_KEY: ${{ secrets.VARDRYNN_RELEASE_SIGNING_KEY }}
          VARDRYNN_RELEASE_PUBLIC_KEY: ${{ vars.VARDRYNN_RELEASE_PUBLIC_KEY }}
          NOTES_URL: ${{ vars.VARDRYNN_RELEASE_NOTES_URL || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
        run: |
          set -euo pipefail
          : "${S3_ENDPOINT:?set the VARDRYNN_S3_ENDPOINT variable}" "${S3_BUCKET:?set the bucket variable for $TARGET}"
          version=$(node -p "require('./xmcl-electron-app/package.json').version")
          mkdir -p release
          # electron-builder output is nested; installers are the only files the manifest can match.
          find build -maxdepth 3 -type f \( -name 'vardrynn-*.dmg' -o -name 'vardrynn-*.deb' \) -exec cp {} release/ \;
          pnpm tsx scripts/vardrynn-release.ts manifest \
            --version "$version" --channel "$TARGET" --dir release \
            --download-base "${S3_ENDPOINT%/}/$S3_BUCKET/$version" --notes-url "$NOTES_URL" \
            --out release/release.json
          (cd release && sha256sum vardrynn-* > SHA256SUMS)
      - name: Upload signed release
        uses: actions/upload-artifact@v6
        with:
          name: vardrynn-release
          path: release/
      - name: Publish to the ${{ env.TARGET }} bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.publish == 'dev' && secrets.VARDRYNN_S3_DEV_ACCESS_KEY_ID || secrets.VARDRYNN_S3_PROD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.publish == 'dev' && secrets.VARDRYNN_S3_DEV_SECRET_ACCESS_KEY || secrets.VARDRYNN_S3_PROD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # Production versions are immutable; the dev bucket may be overwritten by test runs.
          ALLOW_REPUBLISH: ${{ inputs.publish == 'dev' && '1' || '' }}
        run: bash scripts/vardrynn-publish.sh release
